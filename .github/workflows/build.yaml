name: Build

on:
    push:
        branches-ignore:
            - 'dependabot/**'
        paths-ignore:
            - "*.md"
    pull_request:
        paths-ignore:
            - "*.md"
    release:
        types: [created]
    schedule:
        -
            cron: "0 1 * * 6" # Run at 1am every Saturday
    workflow_dispatch: ~

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    tests:
        runs-on: ubuntu-latest

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.database }}"

        strategy:
            fail-fast: false
            matrix:
                # Sylius 2.2: PHP >= 8.2, Symfony 6.4 / 7.4. Sylius 2.3: PHP >= 8.3, Symfony 6.4 / 7.4 / 8.0
                # (Symfony 8 needs PHP 8.4, and runs on 8.5 too; API Platform 5 and Symfony UX 3 are resolved there).
                # https://github.com/Sylius/Sylius/blob/2.3/composer.json
                php: ["8.3", "8.4"]
                symfony: ["^7.4"]
                sylius: ["~2.2.0", "~2.3.0"]
                database: ["mysql:8.4"]
                node: ["22.x"]

                include:
                    - php: "8.2"
                      symfony: "^6.4"
                      sylius: "~2.2.0"
                      database: "mysql:8.4"
                      node: "22.x"
                    - php: "8.3"
                      symfony: "^6.4"
                      sylius: "~2.3.0"
                      database: "mysql:8.4"
                      node: "22.x"
                    - php: "8.4"
                      symfony: "^8.0"
                      sylius: "~2.3.0"
                      database: "mysql:8.4"
                      node: "22.x"
                    - php: "8.5"
                      symfony: "^8.0"
                      sylius: "~2.3.0"
                      database: "mysql:8.4"
                      node: "22.x"
                    - php: "8.4"
                      symfony: "^7.4"
                      sylius: "~2.2.0"
                      database: "mariadb:11.4"
                      node: "22.x"
                    - php: "8.4"
                      symfony: "^7.4"
                      sylius: "~2.3.0"
                      database: "postgres:17"
                      node: "22.x"

                exclude:
                    # Unsupported combinations (kept explicit in case the axes above change).
                    - sylius: "~2.2.0"
                      symfony: "^8.0"
                    - sylius: "~2.3.0"
                      php: "8.2"

        env:
            APP_ENV: test

        steps:
            -
                uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0


            -
                name: Build Sylius Test Application
                uses: SyliusLabs/BuildTestAppAction@c3b108b5f3c299c55f429a8cf0ed88734d4f4979 # v4.3.1
                with:
                    e2e_js: "yes"
                    cache_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
                    cache_restore_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-"
                    database: "${{ matrix.database }}"
                    node_version: "${{ matrix.node }}"
                    php_version: "${{ matrix.php }}"
                    sylius_version: "${{ matrix.sylius }}"
                    symfony_version: "${{ matrix.symfony }}"

            -
                name: Run static analysis
                # Symfony 6.4 Config builder is not typed enough for PHPStan at level max
                if: matrix.symfony != '^6.4'
                run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

            -
                name: Check coding standard
                run: vendor/bin/ecs check

            -
                name: Run unit tests
                run: vendor/bin/phpunit --colors=always --testsuite=unit

            -
                name: Validate composer.json
                run: composer validate --ansi --strict

            -
                name: Validate container
                run: vendor/bin/console lint:container

            -
                name: Run Non-unit PHPUnit tests
                run: vendor/bin/phpunit --colors=always --testsuite=non-unit
